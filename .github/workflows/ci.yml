# Testes no Windows (o sistema alvo do editor): tipos, testes automáticos e o
# roteiro de ponta a ponta no app Electron de verdade, com o Claude simulado
# por um cliente MCP real. Roda em pull requests e sob demanda.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Guardar capturas e o MP4 exportado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows
          path: .test-output/
          if-no-files-found: ignore
          retention-days: 7
