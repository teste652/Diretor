# Testes no Windows (o sistema alvo do editor) e o instalador de teste.
# - Em cada PR e na main: tipos, testes automáticos, o roteiro de ponta a ponta
#   no app Electron de verdade (com o Claude simulado por um cliente MCP real),
#   o instalador, e o mesmo roteiro no app instalado por ele.
# - Na main: publica o instalador num link fixo, que sempre baixa a versão mais nova:
#   https://github.com/<dono>/<repositório>/releases/download/teste/Diretor-Setup.exe
#   Junto vai o latest.yml, onde o Diretor instalado vê que há versão nova e se atualiza sozinho.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Na main, uma publicação em andamento termina antes da próxima começar.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSAO: 0.1.${{ github.run_number }}
      # Nos testes, o Diretor não procura versão nova (o teste da atualização liga de novo).
      DIRETOR_SEM_ATUALIZAR: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # o Electron 45 pede 22.12 ou mais novo
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      # Artefatos com prazo curto: o plano gratuito tem pouco espaço para eles em repositório privado.
      - name: Guardar capturas e o MP4 exportado
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: e2e-windows
          path: .test-output/
          # a pasta começa com ponto: sem isto o upload a ignora
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 2

      - name: Gerar o instalador
        run: npm run dist -- --win nsis --x64 "-c.extraMetadata.version=${{ env.VERSAO }}"

      - name: Instalar como um usuário instalaria (sem perguntas, só para este usuário)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath release\Diretor-Setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "O instalador terminou com o código $($p.ExitCode)." }
          Stop-Process -Name Diretor -ErrorAction SilentlyContinue
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter Diretor.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'O Diretor.exe não apareceu em %LOCALAPPDATA%\Programs depois de instalar.' }
          Write-Host "Instalado em $($exe.FullName)"
          "DIRETOR_APP=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Roteiro de ponta a ponta no app instalado
        run: node scripts/e2e.mjs

      # Uma versão nova anunciada por um servidor local: baixa, fecha, instala e abre de novo.
      - name: Atualização automática no app instalado
        run: node scripts/update-check.mjs

      # Atualizar com o Claude Desktop aberto (o servidor do Claude roda do Diretor.exe instalado).
      - name: Instalar por cima com o servidor do Claude aberto
        run: node scripts/installer-check.mjs atualizar

      - name: Desinstalar e conferir a configuração do Claude Desktop
        run: node scripts/installer-check.mjs desinstalar

      - name: Guardar capturas do app instalado
        if: always() && env.DIRETOR_APP != ''
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: e2e-windows-instalado
          path: .test-output/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 2

      # Só para passar ao passo de publicar (o link fixo é a versão de teste, não o artefato).
      - name: Guardar o instalador para publicar
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: Diretor-Setup
          path: |
            release/Diretor-Setup.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 1

  # Só depois de tudo passar no Windows, e só a partir da main.
  publicar:
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # criar e atualizar a versão de teste
      actions: write # baixar o instalador gerado no Windows e apagar o artefato depois
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSAO: 0.1.${{ github.run_number }}
    steps:
      - name: Baixar o instalador testado
        run: gh run download "$GITHUB_RUN_ID" --name Diretor-Setup --dir instalador

      - name: Publicar no link fixo
        run: |
          set -euo pipefail
          TAG=teste
          NOME=Diretor-Setup.exe
          # Rodar de novo uma execução antiga nunca troca o link por uma versão mais velha.
          ATUAL=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$ATUAL" != "$GITHUB_SHA" ]; then
            echo "::notice::A main já está em ${ATUAL:0:7}. Este instalador (${GITHUB_SHA:0:7}) não é o mais novo e não foi publicado."
            exit 0
          fi
          COMMIT=${GITHUB_SHA:0:7}
          TITLE="Diretor $VERSAO (versão de teste)"
          cat > notas.md <<EOF
          Versão de teste gerada automaticamente da \`main\` (commit $COMMIT). Este link sempre baixa a versão mais nova:
          https://github.com/$GH_REPO/releases/download/$TAG/$NOME

          **Instalar**
          1. Com a sua conta do GitHub aberta no navegador (o repositório é privado), baixe o **$NOME** (em Assets, logo abaixo).
          2. O instalador ainda não tem assinatura digital, então o navegador pode avisar que o arquivo "não é baixado com frequência". No Edge: clique nos três pontinhos ao lado do download, em **Manter**, depois em **Mostrar mais** e em **Manter mesmo assim**. No Chrome: **Manter**.
          3. Abra o arquivo. Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações** e depois em **Executar assim mesmo**.
          4. O Diretor instala sozinho, sem perguntas, e abre. Ele fica no menu Iniciar.

          Se o Windows bloquear o arquivo sem mostrar "Executar assim mesmo", é o Controle Inteligente de Aplicativos, que barra programas sem assinatura digital. Nesse caso o instalador ainda não funciona nesse computador.

          **Usar com o Claude**
          1. Feche o Claude Desktop por completo (botão direito no ícone dele, perto do relógio ou dentro da setinha ^, e Sair).
          2. No painel do Claude, dentro do Diretor, clique em **Conectar**.
          3. Abra o Claude Desktop de novo. O conector "diretor" aparece nele.

          **Atualizar**
          O Diretor se atualiza sozinho: ao abrir (e a cada quatro horas) ele procura versão nova, baixa e pergunta se pode reiniciar. Se escolher "Depois", ela é instalada quando você fechar o Diretor. Se o Claude Desktop estava conectado, depois feche ele por completo e abra de novo.

          Para atualizar à mão (ou se a sua versão é de antes da atualização automática): salve o projeto, feche o Diretor, baixe de novo por este mesmo link e instale por cima. Seus projetos continuam onde você salvou.
          EOF
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # O latest.yml (que anuncia a versão nova aos apps instalados) só depois do instalador.
            gh release create "$TAG" "instalador/$NOME" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notas.md --prerelease
            gh release upload "$TAG" instalador/latest.yml
          else
            # Sobe com outro nome e só então troca: o link não fica sem arquivo durante o upload,
            # e se o upload falhar a versão anterior continua lá.
            asset_ids() { gh api "repos/$GH_REPO/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$1\") | .id"; }
            for id in $(asset_ids Diretor-Setup-novo.exe); do gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"; done
            cp "instalador/$NOME" instalador/Diretor-Setup-novo.exe
            gh release upload "$TAG" instalador/Diretor-Setup-novo.exe
            NOVO=$(asset_ids Diretor-Setup-novo.exe)
            # Sem o arquivo novo na lista, o antigo fica: o link nunca fica sem arquivo.
            [ -n "$NOVO" ] || { echo "::error::O upload terminou, mas o arquivo novo não aparece na versão de teste. O link continua com a versão anterior."; exit 1; }
            for id in $(asset_ids "$NOME"); do gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"; done
            gh api -X PATCH "repos/$GH_REPO/releases/assets/$NOVO" -f name="$NOME" > /dev/null
            # Só com o instalador novo no lugar os apps instalados ficam sabendo da versão nova.
            gh release upload "$TAG" instalador/latest.yml --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notas.md --prerelease
          fi
          echo "Publicado: https://github.com/$GH_REPO/releases/download/$TAG/$NOME"

      # Só depois de publicar: se a publicação falhar, "Re-run failed jobs" ainda acha o instalador.
      - name: Apagar o artefato do instalador (já está na versão de teste)
        continue-on-error: true
        run: |
          for id in $(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "Diretor-Setup") | .id'); do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
